name: Deploy and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv pip install --system -r src/backend/requirements.txt
          uv pip install --system pytest httpx

      - name: Generate test dataset
        run: python dataset/generate_samples.py

      - name: Run unit tests
        run: |
          cd src/backend
          python -m pytest ../../tests/test_api.py -v

  deploy:
    runs-on: ubuntu-latest
    needs: test-unit
    environment: dev
    outputs:
      backend_url: ${{ steps.deploy.outputs.BACKEND_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Log in with Azure (Federated Credentials)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dataset dependencies
        run: uv pip install --system "Pillow>=10.4.0"

      - name: Generate test dataset
        run: python dataset/generate_samples.py

      - name: Provision and Deploy
        id: deploy
        run: |
          azd up --no-prompt
          echo "BACKEND_URL=$(azd env get-value BACKEND_URL)" >> "$GITHUB_OUTPUT"
        env:
          AZURE_ENV_NAME: doc-intelligence-demo
          AZURE_LOCATION: swedencentral
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: doc-intelligence-demo

  test-e2e:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv pip install --system -r src/backend/requirements.txt
          uv pip install --system pytest httpx

      - name: Generate test dataset
        run: python dataset/generate_samples.py

      - name: Run e2e tests
        run: python -m pytest tests/test_e2e.py -v
        env:
          BACKEND_URL: ${{ needs.deploy.outputs.backend_url }}
